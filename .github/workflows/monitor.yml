name: Monitor citas pasaporte

on:
  # Disparo principal: cron-job.org llama a la API cada 5 min (puntual)
  workflow_dispatch:
  # Respaldo por si cron-job.org falla (GitHub puede retrasarlo)
  schedule:
    - cron: "*/15 * * * *"

# Evita dos ejecuciones a la vez (se pisarían el state.json)
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar disponibilidad
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py --once --services PASAPORTE

      - name: Guardar estado
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Actualizar estado de huecos" && git push)
